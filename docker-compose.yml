services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supplymesh
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d supplymesh"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - supplymesh-postgres:/var/lib/postgresql/data

  migrations:
    build: .
    command: sh -c "alembic upgrade head && python -m scripts.setup_checkpoints"
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/supplymesh
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    command: python -m scripts.seed_demo
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/supplymesh
    depends_on:
      migrations:
        condition: service_completed_successfully

  supplier-simulator:
    build: .
    command: uvicorn apps.supplier_simulator.main:app --host 0.0.0.0 --port 8001
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/supplymesh
    ports:
      - "${SUPPLIER_SIMULATOR_HOST_PORT:-8001}:8001"
    depends_on:
      seed:
        condition: service_completed_successfully

  agent-host:
    build: .
    command: python -m apps.agent_host.main
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/supplymesh
      SUPPLIER_SIMULATOR_BASE_URL: http://supplier-simulator:8001
    ports:
      - "${AGENT_HOST_PUBLISHED_PORT:-8000}:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      supplier-simulator:
        condition: service_started

volumes:
  supplymesh-postgres:

